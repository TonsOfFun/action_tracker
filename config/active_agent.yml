# Providers the tracker's agents and the dashboard can run on.
#
# The dashboard counts a provider as available when it has an access_token
# here (or a key added under Settings -> Provider API Keys). Put the keys in
# .env, which is git-ignored:
#
#   ANTHROPIC_API_KEY=sk-ant-...
#   OPENAI_API_KEY=sk-...        # optional: a second model to compare against

default: &default
  anthropic:
    service: "Anthropic"
    access_token: <%= ENV["ANTHROPIC_API_KEY"] %>
    # bin/rehearse points this at the scripted stand-in (script/rehearsal_provider.rb).
    base_url: <%= ENV.fetch("ANTHROPIC_BASE_URL", "https://api.anthropic.com") %>
    model: <%= ENV.fetch("TRACKER_MODEL", "claude-haiku-4-5") %>
  # One key, many models, Claude among them ("anthropic/claude-haiku-4.5").
  openrouter:
    service: "OpenRouter"
    access_token: <%= ENV["OPENROUTER_API_KEY"] %>
    model: "anthropic/claude-haiku-4.5"
  openai:
    service: "OpenAI"
    access_token: <%= ENV["OPENAI_API_KEY"] %>
    model: "gpt-4o-mini"
  # Where traces go. By default they are stored in this app's database, where
  # the mounted dashboard reads them. Set ACTIVEAGENTS_API_KEY and they are
  # sent to a hosted workspace on activeagents.ai instead (or to the endpoint
  # in ACTIVEAGENTS_TRACES_ENDPOINT).
  telemetry:
    enabled: true
<% if ENV["ACTIVEAGENTS_API_KEY"].present? %>
    endpoint: <%= ENV.fetch("ACTIVEAGENTS_TRACES_ENDPOINT", "https://api.activeagents.ai/v1/traces") %>
    api_key: <%= ENV["ACTIVEAGENTS_API_KEY"] %>
<% else %>
    local_storage: true
<% end %>

development:
  <<: *default

test:
  <<: *default
  mock:
    service: "Mock"
    model: "mock-model"

production:
  <<: *default
